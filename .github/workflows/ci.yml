name: Scaffold checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sunshine
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: sunshine_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sunshine -d sunshine_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://sunshine:ci_only@127.0.0.1:5432/sunshine_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run db:deploy
      - run: npm run smoke
